[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "clir-benchmark"
version = "0.1.0"
description = "Reproducible, span-grounded multilingual dense retrieval benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pyarrow>=19,<24",
  "PyYAML>=6,<7",
  "huggingface-hub>=0.30,<1",
  "transformers>=4.51,<5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
models = [
  "torch>=2.6,<3",
  "sentence-transformers>=5,<6",
  "einops>=0.8,<1",
  # SapBERT publishes a SentencePiece model without tokenizer.json; both are
  # required to construct the fast tokenizer used for source-offset auditing.
  "sentencepiece>=0.2,<0.3",
  "protobuf>=5,<7",
]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
clir-benchmark = "clir_benchmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads only the pinned tokenizer; no model weights or benchmark runs"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
