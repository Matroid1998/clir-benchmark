models: &models
  - embeddinggemma
  - bge-m3
  - qwen3-0.6B
  - nomic-v2-moe
  - granite-278m
  - gte-multilingual-base
  - arctic-embed-l-v2
  - e5-large-instruct
chunking:
  boundary_policy: shared-sentences-v1
  models: *models
  icu_version: '73.2'
  max_words: 200
  overlap_words: 30
  max_tokens: null
bm25:
  k1: 1.2
  b: 0.75
  analyzer: unicode-words-cjk-v1
cache_hybrid_candidates: true
hybrid:
  candidate_k: 1000
  rank_constant: 60
  dense_weight: 1.0
  bm25_weight: 1.0
runtime:
  device: cuda
  dtype: bfloat16
  batch_size: 16
