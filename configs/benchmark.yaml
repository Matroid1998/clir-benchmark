version: 1
output_dir: ../artifacts
env_file: ../.env
datasets:
  eurlex:
    qa:
      repo_id: MehdiAstaraki/eurlex-generated-qa
      revision: c924c03d0ac73ee45a3b6910d420fe523e433d2d
    corpus:
      repo_id: MehdiAstaraki/eurlex-generated-qa
      revision: 8b5d1bd5604e7ebb7c27bc6d877b6b3ef712a006
  un:
    qa:
      repo_id: MehdiAstaraki/un-generated-qa
      revision: 677117c2e82908933821ba68dfd122d273c20be0
    corpus:
      repo_id: MehdiAstaraki/un-generated-qa
      revision: 79b190ab68940cfed6236c372cbfe53404339c05
  chemistry:
    qa:
      repo_id: MehdiAstaraki/chemistry-generated-qa
      revision: bb2657593e877d75e747a4602468eb0add634895
    corpus:
      repo_id: BASF-AI/ai4chem-clir-google-patents-within-document-abstract-pairs
      revision: 24c1f894591a5aa6f745ac233d5091fdbc30ad3c
chunking:
  tokenizer_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  max_tokens: 512
  overlap_tokens: 64
  boundary_policy: source-token-windows-v1
  special_tokens: included
candidate_mode: best
settings: [pairwise, mixed]
# Discover query languages from the selected questions.
query_languages: []
# Published alignment coverage. All corpus languages remain in corpus artifacts.
# Use [] to target every corpus language (unannotated settings will block).
target_languages: [en, de, es, fr, zh]
# Optional JSONL overlay: query_id + evidence_all_languages (+ alignment fields).
evidence_file: null
models: [embeddinggemma, bge-m3, qwen3-0.6B, nomic-v2-moe, granite-278m, LaBSE, SapBERT, e5-large-instruct]
# retrieve/evaluate defaults; override with repeated --baseline flags.
baselines: [dense]
# Explicitly choose an endpoint and model before running `translate`.
# endpoint is the complete Chat Completions URL, not the API base URL.
translation:
  endpoint: null
  model: null
  api_key_env: TRANSLATION_API_KEY
  response_format: json_schema  # Also supports json_object or text, with strict local validation.
  request_options: {}  # Model-specific temperature, reasoning_effort, max_completion_tokens, etc.
  timeout_seconds: 120
  # Set your provider's USD rates; missing rates/usage produce null costs, never zero.
  input_usd_per_million: null
  cached_input_usd_per_million: null
  output_usd_per_million: null
bm25:
  k1: 1.2
  b: 0.75
  analyzer: unicode-words-cjk-v1
hybrid:
  candidate_k: 1000
  rank_constant: 60
  dense_weight: 1.0
  bm25_weight: 1.0
runtime:
  device: auto
  dtype: float32
  batch_size: 32
  query_batch_size: 16
  corpus_block_size: 8192
