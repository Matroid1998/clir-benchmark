chunking:
  tokenizer_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  max_tokens: 512
  overlap_tokens: 64
  boundary_policy: source-token-windows-v1
  special_tokens: included
candidate_mode: best
settings: [pairwise, mixed]
# Empty lists discover each corpus's own language coverage.
query_languages: []
target_languages: []
# Optional JSONL overlay: query_id + evidence_all_languages.
evidence_file: null
models: [embeddinggemma, bge-m3, qwen3-0.6B, nomic-v2-moe, granite-278m, LaBSE, SapBERT, e5-large-instruct]
runtime:
  device: auto
  dtype: float32
  batch_size: 32
  query_batch_size: 16
  corpus_block_size: 8192
