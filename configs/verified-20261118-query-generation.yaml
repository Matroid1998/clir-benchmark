version: 1
output_dir: ../artifacts/verified-20261118-query-generation
env_file: ../.env
candidate_mode: all
retrieval_unit: chunk
baselines: [hybrid]
datasets:
  chemistry:
    corpus_format: verified-multilingual-v1
    qa: &patents
      repo_id: MehdiAstaraki/google-patents-generated-qa-verified-20261118
      revision: 9459adf9bfdc4f1f14ad6072de856b9e4a0d30ed
    corpus: *patents
  eurlex:
    corpus_format: verified-multilingual-v1
    qa: &eurlex
      repo_id: MehdiAstaraki/eurlex-generated-qa-verified-20261118
      revision: e1e4e3fd1a9f8c15adf1dbbb239ba4ddc0317ede
    corpus: *eurlex
  un:
    corpus_format: verified-multilingual-v1
    qa: &un
      repo_id: MehdiAstaraki/un-generated-qa-verified-20261118
      revision: 910ee8435bc4e5a41ccd5f913c30ebc1237eb130
    corpus: *un
query_generation:
  input_mode: verified-qas
  hyde_language_policy: question-language
  corpus_languages:
    chemistry: [de, en, es, fr, ja, ru, zh]
    eurlex: [de, en, es, fr]
    un: [ar, en, es, fr, ru, zh]
  model_by_language:
    ar: luna
    de: haiku
    en: haiku
    es: haiku
    fr: haiku
    ja: qwen
    ru: haiku
    zh: qwen
  models:
    luna:
      model: openai/gpt-5.6-luna
      endpoint: &endpoint https://openrouter.ai/api/v1/chat/completions
      api_key_env: OPENROUTER_API_KEY
      request_options: &request
        reasoning_effort: low
        max_tokens: 8192
        provider: {require_parameters: true}
        usage: {include: true}
      # Standard catalog prices per million tokens, checked 2026-11-19.
      input_usd_per_million: 0.20
      cached_input_usd_per_million: 0.02
      output_usd_per_million: 1.20
    haiku:
      model: anthropic/claude-haiku-5.5
      endpoint: *endpoint
      api_key_env: OPENROUTER_API_KEY
      request_options: *request
      input_usd_per_million: 0.10
      cached_input_usd_per_million: 0.01
      output_usd_per_million: 0.50
    qwen:
      model: qwen/qwen3.8-27b
      endpoint: *endpoint
      api_key_env: OPENROUTER_API_KEY
      request_options: *request
      # Provider prices vary. Use the cost returned with each completion.
